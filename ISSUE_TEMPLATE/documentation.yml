name: Documentation task
description: Improve missing, stale, or unclear documentation.
title: "[Docs]: "
labels: ["type:documentation"]
body:
  - type: input
    id: audience
    attributes:
      label: Audience
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Missing or incorrect context
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Canonical source
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files affected
    validations:
      required: true

